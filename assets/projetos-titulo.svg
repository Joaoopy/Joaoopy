<svg xmlns="http://www.w3.org/2000/svg" width="720" height="152" viewBox="0 0 720 152" role="img" aria-labelledby="t d"><title id="t">Projetos em destaque</title><desc id="d">Projetos em destaque: invite-system, zerobug-pay e eden-guard.</desc><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Inter';font-weight:700;src:url(data:font/woff;base64,) format('woff')}text{font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.fx{transform-box:fill-box}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes drawx{from{transform:scaleX(0)}}@keyframes drawy{from{transform:scaleY(0)}}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.pop{animation:pop .6s cubic-bezier(.2,.7,.2,1) backwards}</style><rect x=".5" y=".5" width="719" height="151" rx="15.5" fill="#0d1117" stroke="#30363d"/><text class="rise" x="48" y="56" font-size="13" font-weight="600" letter-spacing="3" fill="#58a6ff" style="animation-delay:0.0s">PROJETOS</text><text class="rise" x="48" y="98" font-size="32" font-weight="700" letter-spacing="-0.6" fill="#e6edf3" style="animation-delay:0.1s">Projetos em destaque</text><text class="rise" x="48" y="128" font-size="17" fill="#8b949e" style="animation-delay:0.2s">Três projetos públicos, com o código aberto no GitHub.</text></svg>